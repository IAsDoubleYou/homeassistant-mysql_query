name: Validate with HACS

on:
  push:
  pull_request:
  workflow_dispatch:  # manual trigger button
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # No brand assets yet, and the integration is not in home-assistant/brands.
          # Only relevant for inclusion in the HACS default store, not for installing
          # this repository as a custom repository.
          ignore: "brands"
