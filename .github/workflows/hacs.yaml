name: Validate with HACS

on:
  push:
  pull_request:
  workflow_dispatch:  # manual trigger button
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
