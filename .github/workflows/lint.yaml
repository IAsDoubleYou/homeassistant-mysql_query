name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format github"
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
