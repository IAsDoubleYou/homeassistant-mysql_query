query:
  name: Query (Legacy)
  description: Executes a SQL query and returns the results in a simple list.
  fields:
    query:
      name: Query
      description: The SQL query to execute.
      required: true
      example: "SELECT * FROM states WHERE entity_id = %s LIMIT 10"
      selector:
        text:
          multiline: true
    values:
      name: Values
      description: >
        Optional list of values for the %s placeholders in the query, in the
        order the placeholders appear. Templates are rendered with their native
        type, so numbers, booleans and none stay an int, float, bool or NULL.
      required: false
      example: '["sensor.temperature", 10]'
      selector:
        object:
    db4query:
      name: Database Override
      description: Optionally specify a different database name for this query.
      required: false
      selector:
        text:
    config_entry:
      name: Connection
      description: Choose which saved connection to use.
      required: false
      selector:
        config_entry:
          integration: mysql_query

execute:
  name: Execute (Modern)
  description: >
    Executes a SQL query and returns results with full metadata, including
    rows_found, rows_returned, and rows_affected.
  fields:
    query:
      name: Query
      description: The SQL query to execute.
      required: true
      example: "UPDATE users SET status = %s WHERE id = %s"
      selector:
        text:
          multiline: true
    values:
      name: Values
      description: >
        Optional list of values for the %s placeholders in the query, in the
        order the placeholders appear. Templates are rendered with their native
        type, so numbers, booleans and none stay an int, float, bool or NULL.
      required: false
      example: '["active", 1]'
      selector:
        object:
    db4query:
      name: Database Override
      description: Optionally specify a different database name for this query.
      required: false
      selector:
        text:
    config_entry:
      name: Connection
      description: Choose which saved connection to use.
      required: false
      selector:
        config_entry:
          integration: mysql_query